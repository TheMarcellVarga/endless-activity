name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v6
      - name: Run small-device test suite
        run: >-
          xcodebuild -project EndlessActivity.xcodeproj
          -scheme EndlessActivity
          -destination 'platform=iOS Simulator,name=iPhone 17e,OS=26.5'
          test
      - name: Verify large-device build
        run: >-
          xcodebuild -project EndlessActivity.xcodeproj
          -scheme EndlessActivity
          -destination 'platform=iOS Simulator,name=iPhone 17 Pro Max,OS=26.5'
          build
